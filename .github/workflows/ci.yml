name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DEPS: >-
    build-essential cmake ninja-build extra-cmake-modules qtbase5-dev
    libkf5coreaddons-dev libkf5i18n-dev libkf5config-dev
    libkf5widgetsaddons-dev libkf5xmlgui-dev
  QT_QPA_PLATFORM: offscreen

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-format
      - name: Check formatting
        run: >-
          find src tests -name '*.cpp' -o -name '*.h'
          | xargs clang-format --dry-run --Werror

  build-test:
    name: Build and test (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cxx: g++
          - compiler: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $DEPS clang
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DKDETODO_WERROR=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Install
        run: DESTDIR="$PWD/stage" cmake --install build && test -x stage/usr/bin/kdetodo

  sanitizers:
    name: Tests with ASan and UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $DEPS
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DKDETODO_SANITIZE=ON
          -DKDETODO_WERROR=ON
      - name: Build
        run: cmake --build build
      - name: Test
        env:
          # Qt and fontconfig keep process-lifetime allocations.
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure

  static-analysis:
    name: clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $DEPS clang-tidy
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - name: Build (generates moc files)
        run: cmake --build build
      - name: Run clang-tidy
        run: run-clang-tidy -quiet -p build "$PWD/(src|tests)/.*\.cpp$"
